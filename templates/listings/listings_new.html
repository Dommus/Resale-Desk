{% extends "layout.html" %}
{% block title %}New Listing{% endblock %}
{% block content %}

<h3 class="mb-1">Add Listing</h3>
<p class="text-muted">for <strong>{{ item.name }}</strong> (<code class="inv-code">{{ item.inventory_code }}</code>)</p>

<div class="card shadow-sm">
    <div class="card-body">
        <form method="post">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Platform</label>
                    <input type="text" class="form-control" name="platform" list="platformOptions" placeholder="e.g. Vinted, eBay, OLX" required>
                    <datalist id="platformOptions">
                        <option value="Vinted"><option value="eBay"><option value="OLX"><option value="Facebook Marketplace">
                    </datalist>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Listing ID (from the platform)</label>
                    <input type="text" class="form-control" name="listing_id" required>
                </div>
                <div class="col-md-8">
                    <label class="form-label">Listing URL</label>
                    <input type="url" class="form-control" name="listing_url" placeholder="https://...">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Listing Price (€)</label>
                    <input type="number" step="0.01" min="0" class="form-control" name="listing_price">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Date Listed</label>
                    <input type="date" class="form-control" name="date_listed" value="">
                </div>
            </div>
            <button type="submit" class="btn btn-primary mt-3">Add Listing</button>
            <a href="{{ url_for('view_item', item_id=item.id) }}" class="btn btn-link mt-3">Cancel</a>
        </form>
    </div>
</div>

{% endblock %}
