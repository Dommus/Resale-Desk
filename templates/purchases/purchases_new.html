{% extends "layout.html" %}
{% block title %}New Purchase{% endblock %}
{% block content %}

<h3 class="mb-3">Record a Purchase</h3>

<div class="card shadow-sm">
    <div class="card-body">
        <form method="post">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Date</label>
                    <input type="date" class="form-control" name="date" value="{{ today }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Seller</label>
                    <input type="text" class="form-control" name="seller" placeholder="e.g. livestream, Vinted user...">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Platform / Source</label>
                    <input type="text" class="form-control" name="platform" placeholder="e.g. Vinted...">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Purchase Type</label>
                    <select class="form-select" name="purchase_type" required>
                        <option value="single">Single item</option>
                        <option value="bundle">Bundle (multiple items)</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Purchase Price (€)</label>
                    <input type="number" step="0.01" min="0" class="form-control" name="purchase_price" value="0" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Shipping Cost (€)</label>
                    <input type="number" step="0.01" min="0" class="form-control" name="shipping_cost" value="0">
                </div>

                <div class="col-12">
                    <label class="form-label">Purchase Notes</label>
                    <textarea class="form-control" name="purchaseNotes" rows="2"></textarea>
                </div>

                <div class="col-12">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="addItemsToggle" name="addItemsToggle" checked>
                        <label class="form-check-label" for="addItemsToggle">
                            Add Items
                        </label>
                    </div>
                </div>
            </div>

            <div id="singleItemFields" class="border-top mt-4 pt-3">
                <h6 class="mb-3">Item Details</h6>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Item Name <span class="required-symbol"> * </span></label>
                        <input type="text" class="form-control" name="itemName" id="itemName" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Category</label>
                        <input type="text" class="form-control" name="category" placeholder="e.g. Video Game">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Brand</label>
                        <input type="text" class="form-control" name="brand" placeholder="e.g. Nike">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Condition</label>
                        <select class="form-select" name="condition">
                            <option value="">-</option>
                            <option>New</option>
                            <option>Like New</option>
                            <option>Good</option>
                            <option>Fair</option>
                            <option>Poor</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Shelf</label>
                        <select class="form-select" name="shelf_id">
                            <option value="">-</option>
                            {% for shelf in shelves %}
                            <option value="{{ shelf.id }}">{{ shelf.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Notes</label>
                        <input type="text" class="form-control" name="itemNotes" placeholder="e.g. Broken">
                    </div>
                </div>
            </div>

            <div id="bundleItemFields" class="border-top mt-4 pt-3 d-none">
                <h6 class="mb-3">Bundle Items</h6>
                <div class="table-responsive">
                    <table class="table align-middle mb-2" id="bundleItemsTable">
                        <thead>
                            <tr>
                                <th>Item Name</th>
                                <th>Category</th>
                                <th>Brand</th>
                                <th>Condition</th>
                                <th>Shelf</th>
                                <th>Notes</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr class="bundle-item-row">
                                <td><input type="text" class="form-control" name="itemName[]" required></td>
                                <td><input type="text" class="form-control" name="category[]" placeholder="e.g. Video Game"></td>
                                <td><input type="text" class="form-control" name="brand[]" placeholder="e.g. Nike"></td>
                                <td>
                                    <select class="form-select" name="condition[]">
                                        <option value="">-</option>
                                        <option>New</option><option>Like New</option><option>Good</option>
                                        <option>Fair</option><option>Poor</option>
                                    </select>
                                </td>
                                <td>
                                    <select class="form-select" name="shelf_id[]">
                                        <option value="">-</option>
                                        {% for shelf in shelves %}<option value="{{ shelf.id }}">{{ shelf.name }}</option>{% endfor %}
                                    </select>
                                </td>
                                <td><input type="text" class="form-control" name="itemNotes[]" placeholder="e.g. Broken"></td>
                                <td><button type="button" class="btn btn-sm btn-outline-danger remove-bundle-row d-none" aria-label="Remove item">&times;</button></td>
                            </tr>
                            <tr id="addBundleRow" class="bundle-add-row text-body-secondary" role="button" tabindex="0" aria-label="Add another bundle item">
                                <td colspan="7" class="text-center py-3">
                                    <i class="bi bi-plus-lg"></i> Click to add another item
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <button type="submit" class="btn btn-primary mt-4" id="submitBtn">Save Purchase with Items</button>
        </form>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
const typeSelect = document.querySelector('select[name="purchase_type"]');
const addItemsToggle = document.getElementById('addItemsToggle');
const singleFields = document.getElementById('singleItemFields');
const bundleFields = document.getElementById('bundleItemFields');
const bundleTable = document.querySelector('#bundleItemsTable tbody');
const addBundleRow = document.getElementById('addBundleRow');
const nameInput = document.getElementById('itemName');
const submitBtn = document.getElementById('submitBtn');

function toggleSingleFields() {
    const shouldShowDetails = addItemsToggle.checked && typeSelect.value === 'single';
    const shouldShowBundle = addItemsToggle.checked && typeSelect.value === 'bundle';
    singleFields.classList.toggle('d-none', !shouldShowDetails);
    bundleFields.classList.toggle('d-none', !shouldShowBundle);
    nameInput.required = shouldShowDetails;
    bundleFields.querySelectorAll('input, select').forEach(field => {
        field.disabled = !shouldShowBundle;
    });
    bundleFields.querySelector('.bundle-item-row input[name="itemName[]"]').required = shouldShowBundle;
    submitBtn.textContent = (shouldShowDetails || shouldShowBundle) ? 'Save Purchase with Items' : 'Save Purchase';
}

typeSelect.addEventListener('change', toggleSingleFields);
addItemsToggle.addEventListener('change', toggleSingleFields);
toggleSingleFields();

function addBundleItem() {
    const sourceRow = bundleTable.querySelector('.bundle-item-row');
    const row = sourceRow.cloneNode(true);
    row.querySelectorAll('input').forEach(input => input.value = '');
    row.querySelectorAll('select').forEach(select => select.selectedIndex = 0);
    row.querySelector('.remove-bundle-row').classList.remove('d-none');
    bundleTable.insertBefore(row, addBundleRow);
    toggleSingleFields();
}

addBundleRow.addEventListener('click', addBundleItem);
addBundleRow.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        addBundleItem();
    }
});

bundleTable.addEventListener('click', event => {
    const removeButton = event.target.closest('.remove-bundle-row');
    if (removeButton && bundleTable.querySelectorAll('.bundle-item-row').length > 1) {
        removeButton.closest('.bundle-item-row').remove();
    }
});
</script>
{% endblock %}
