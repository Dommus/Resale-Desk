{% extends "layout.html" %}
{% block title %}New Purchase{% endblock %}
{% block content %}

<h3 class="mb-3">Record a Purchase</h3>

<div class="card shadow-sm">
    <div class="card-body">
        <form method="post">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Date</label>
                    <input type="date" class="form-control" name="date" value="{{ today }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Seller</label>
                    <input type="text" class="form-control" name="seller" placeholder="e.g. car boot sale, Vinted user...">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Platform / Source</label>
                    <input type="text" class="form-control" name="platform" placeholder="e.g. Facebook Marketplace">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Purchase Type</label>
                    <select class="form-select" name="purchase_type" required>
                        <option value="single">Single item</option>
                        <option value="bundle">Bundle (multiple items)</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Purchase Price (€)</label>
                    <input type="number" step="0.01" min="0" class="form-control" name="purchase_price" value="0" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Shipping Cost (€)</label>
                    <input type="number" step="0.01" min="0" class="form-control" name="shipping_cost" value="0">
                </div>

                <div class="col-12">
                    <label class="form-label">Purchase Notes</label>
                    <textarea class="form-control" name="notes" rows="2"></textarea>
                </div>
            </div>

            <div id="singleItemFields" class="border-top mt-4 pt-3">
                <h6 class="mb-3">Item Details</h6>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Item Name</label>
                        <input type="text" class="form-control" name="name" id="itemNameInput">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Category</label>
                        <input type="text" class="form-control" name="category" placeholder="e.g. Video Game">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Condition</label>
                        <select class="form-select" name="condition">
                            <option value="">-</option>
                            <option>New</option>
                            <option>Like New</option>
                            <option>Good</option>
                            <option>Fair</option>
                            <option>Poor</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Shelf</label>
                        <select class="form-select" name="shelf_id">
                            <option value="">-</option>
                            {% for shelf in shelves %}
                            <option value="{{ shelf.id }}">{{ shelf.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary mt-4" id="submitBtn">Save Item</button>
        </form>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
const typeSelect = document.querySelector('select[name="purchase_type"]');
const singleFields = document.getElementById('singleItemFields');
const nameInput = document.getElementById('itemNameInput');
const submitBtn = document.getElementById('submitBtn');

function toggleSingleFields() {
    const isSingle = typeSelect.value === 'single';
    singleFields.classList.toggle('d-none', !isSingle);
    nameInput.required = isSingle;
    submitBtn.textContent = isSingle ? 'Save Item' : 'Continue to Add Items';
}
typeSelect.addEventListener('change', toggleSingleFields);
toggleSingleFields();
</script>
{% endblock %}
