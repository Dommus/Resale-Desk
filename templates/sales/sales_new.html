{% extends "layout.html" %}
{% block title %}Record Sale{% endblock %}
{% block content %}

<h3 class="mb-1">Record Sale</h3>
<p class="text-muted">for <strong>{{ item.name }}</strong> (<code class="inv-code">{{ item.inventory_code }}</code>) &middot; Allocated cost: €{{ "%.2f"|format(item.purchase_cost) }}</p>

<div class="card shadow-sm">
    <div class="card-body">
        <form method="post">
            <div class="row g-3">
                {% if item.listings %}
                <div class="col-md-6">
                    <label class="form-label">Sold via Listing</label>
                    <select class="form-select" name="listing_id">
                        <option value="">Not linked to a specific listing</option>
                        {% for l in item.listings %}
                        <option value="{{ l.id }}">{{ l.platform }} - {{ l.listing_id }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Sale Date</label>
                    <input type="date" class="form-control" name="sale_date" value="{{ datetime_date.today() }}" required>
                </div>
                {% else %}
                <div class="col-md-6">
                    <label class="form-label">Sale Date</label>
                    <input type="date" class="form-control" name="sale_date" value="{{ datetime_date.today() }}" required>
                </div>
                {% endif %}

                <div class="col-md-4">
                    <label class="form-label">Sale Price (€)</label>
                    <input type="number" step="0.01" min="0" class="form-control" name="sale_price" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Shipping Charged to Buyer (€)</label>
                    <input type="number" step="0.01" min="0" class="form-control" name="shipping_received" value="0">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Shipping Cost Paid (€)</label>
                    <input type="number" step="0.01" min="0" class="form-control" name="shipping_paid" value="0">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Platform Fee (€)</label>
                    <input type="number" step="0.01" min="0" class="form-control" name="platform_fee" value="0">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Payment Processing Fee (€)</label>
                    <input type="number" step="0.01" min="0" class="form-control" name="payment_fee" value="0">
                </div>

                <div class="col-12">
                    <label class="form-label">Notes</label>
                    <textarea class="form-control" name="notes" rows="2"></textarea>
                </div>
            </div>

            <button type="submit" class="btn btn-success mt-3"><i class="bi bi-cash-coin"></i> Record Sale</button>
            <a href="{{ url_for('view_item', item_id=item.id) }}" class="btn btn-link mt-3">Cancel</a>
        </form>
    </div>
</div>

{% endblock %}
