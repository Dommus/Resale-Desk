{% extends "layout.html" %}
{% block title %}{{ _('Log In') }}{% endblock %}
{% block content %}
<div class="card auth-card shadow-sm">
    <div class="card-body p-4">
        <h3 class="mb-3 text-center"><i class="bi bi-box-seam"></i> {{ _('Resale Desk') }}</h3>
        <h5 class="mb-3 text-center text-muted">{{ _('Log In') }}</h5>
        <form method="post">
            <div class="mb-3">
                <label class="form-label">{{ _('Username') }}</label>
                <input type="text" class="form-control" name="username" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">{{ _('Password') }}</label>
                <input type="password" class="form-control" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">{{ _('Log In') }}</button>
        </form>
        {% if allow_registration %}
        <p class="text-center mt-3 mb-0 small">
            {{ _('No account yet?') }} <a href="{{ url_for('register') }}">{{ _('Register here') }}</a>
        </p>
        {% endif %}
    </div>
</div>
{% endblock %}
