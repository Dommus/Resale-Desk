<!DOCTYPE html>
{# Shown by the service worker when there is no connection, so it must not
   depend on anything from the network (no Bootstrap, no stylesheet). #}
<html lang="{{ html_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#212529">
    <title>{{ _('Resale Desk') }}</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            background: #e9e8e2;
            color: #1c1d1f;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #212529; color: #dee2e6; }
        }
        button {
            margin-top: 1rem;
            padding: 0.5rem 1.25rem;
            border: 0;
            border-radius: 0.375rem;
            font: inherit;
            background: #1f4e79;
            color: #fff;
        }
    </style>
</head>
<body>
    <main>
        <h1>{{ _("You're offline") }}</h1>
        <p>{{ _('Resale Desk needs an internet connection. Check your connection and try again.') }}</p>
        <button type="button" onclick="location.reload()">{{ _('Try again') }}</button>
    </main>
</body>
</html>
